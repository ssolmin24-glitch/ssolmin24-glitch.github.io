<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>불씨</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="play-screen" id="screen">

    <!-- 배경 (장면이 바뀔 때 두 겹이 번갈아 나타납니다) -->
    <div class="bg bg-a" id="bgA"></div>
    <div class="bg bg-b" id="bgB"></div>
    <div class="bg-dim"></div>

    <!-- 마을 지도 (map.js 가 그림) / 5초 놀이 -->
    <div class="map-layer" id="mapLayer" hidden></div>
    <div class="mini-layer" id="miniLayer" hidden></div>

    <!-- 상단 영역 -->
    <header class="top-bar">
      <div class="content top-bar-inner">
        <div class="top-left">
          <p class="chapter-title" id="chapterTitle"></p>
          <div class="status" id="status" aria-label="현재 상태"></div>
        </div>
        <nav class="top-menu" aria-label="상단 메뉴">
          <button type="button" class="top-menu-button" id="btnRestart">처음부터</button>
          <button type="button" class="top-menu-button" id="btnHelp">도움말</button>
          <button type="button" class="game-logo" id="btnTitle" title="타이틀로">EMBERS</button>
        </nav>
      </div>
    </header>

    <!-- 하단 영역 -->
    <footer class="bottom-area" id="bottomArea">
      <div class="content bottom-area-inner">
        <p class="narration" id="narration"></p>
        <div class="choice-list" id="choices"></div>
        <button type="button" class="next-button" id="btnNext" hidden>계속</button>
      </div>
    </footer>

    <!-- 타이틀 화면 (처음 보이는 화면) -->
    <section class="title-screen" id="title" aria-label="타이틀 화면">
      <div class="title-content">

        <!-- 제목 영역 -->
        <header class="title-area">
          <h1 class="game-title">EMBERS</h1>
        </header>

        <!-- 하단 메뉴 영역 -->
        <nav class="bottom-menu" aria-label="메인 메뉴">
          <ul class="menu-list">
            <li><button type="button" class="menu-button" id="menuStart">시작하기</button></li>
            <li><button type="button" class="menu-button" id="menuContinue">이어하기</button></li>
            <li><button type="button" class="menu-button" id="menuSettings">설정</button></li>
            <li><button type="button" class="menu-button" id="menuHelp">도움말</button></li>
          </ul>
        </nav>

      </div>
    </section>

    <!-- 설정 -->
    <div class="overlay" id="settings" hidden>
      <div class="overlay-box">
        <button type="button" class="choice-button" id="optStatus" aria-pressed="true"></button>
        <button type="button" class="choice-button" id="optCalm" aria-pressed="false"></button>
        <button type="button" class="choice-button" id="optClear">저장된 진행 지우기</button>
        <p class="settings-note" id="settingsNote"></p>
        <button type="button" class="choice-button" id="btnSettingsClose">닫기</button>
      </div>
    </div>

    <!-- 도움말 -->
    <div class="overlay" id="help" hidden>
      <div class="overlay-box">
        <p>화면을 누르거나 Space·Enter 키를 누르면 다음 문장으로 넘어갑니다.</p>
        <p>마을 지도에서는 가고 싶은 집을 눌러 이동합니다. 먼 길은 기력을 씁니다.</p>
        <p>선택지는 마우스나 숫자 키(1~5)로 고를 수 있습니다.</p>
        <p>위쪽의 세 점줄은 죄책감·신뢰·기력입니다. 선택에 따라 오르내리고, 이야기와 결말이 달라집니다.</p>
        <p>이 게임에는 화재와 죄책감, 거절의 경험이 나옵니다. 힘들면 언제든 멈추어도 좋습니다.</p>
        <button type="button" class="choice-button" id="btnHelpClose">닫기</button>
      </div>
    </div>
  </main>

  <script src="js/scenes.js"></script>
  <script src="js/map.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
